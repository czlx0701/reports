<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPARK 自闭症研究网络研讨会</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#e1e4e8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5}
a{color:#58a6ff;text-decoration:none}
a:hover{text-decoration:underline}
.container{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin-bottom:4px;color:#f0f6fc}
.subtitle{color:#8b949e;font-size:13px;margin-bottom:20px}
.stats{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px 18px;min-width:100px}
.stat-card .num{font-size:22px;font-weight:600;color:#f0f6fc}
.stat-card .label{font-size:11px;color:#8b949e;text-transform:uppercase}
.search-box{width:100%;padding:10px 14px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#e1e4e8;font-size:14px;margin-bottom:16px;outline:none;transition:border-color .2s}
.search-box:focus{border-color:#58a6ff}
.topic-section{margin-bottom:8px;border:1px solid #30363d;border-radius:8px;overflow:hidden}
.topic-header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#161b22;cursor:pointer;user-select:none;transition:background .15s}
.topic-header:hover{background:#1c2128}
.topic-header .arrow{color:#8b949e;font-size:12px;transition:transform .2s;width:16px}
.topic-header.open .arrow{transform:rotate(90deg)}
.topic-name{font-weight:600;color:#f0f6fc;font-size:15px}
.topic-count{color:#8b949e;font-size:12px;margin-left:auto}
.video-list{display:none}
.video-list.open{display:block}
.video-row{display:grid;grid-template-columns:32px 1fr 70px;gap:8px;padding:8px 16px 8px 42px;border-top:1px solid #21262d;cursor:pointer;transition:background .12s}
.video-row:hover{background:#1c2128}
.video-row .idx{color:#8b949e;font-size:12px;padding-top:3px}
.video-row .title{color:#e1e4e8;font-size:13px}
.video-row .title .has-ts{display:inline-block;width:6px;height:6px;border-radius:50%;background:#3fb950;margin-right:8px;vertical-align:middle}
.video-row .title .has-md{font-size:11px;margin-left:3px;vertical-align:middle;cursor:help;opacity:0.8}
.video-row .title .no-ts{display:inline-block;width:6px;height:6px;border-radius:50%;background:#30363d;margin-right:8px;vertical-align:middle}
.video-row .dur{color:#8b949e;font-size:12px;text-align:right;padding-top:3px}
.detail-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0f1117;z-index:100;overflow-y:auto}
.detail-overlay.open{display:block}
.detail-header{position:sticky;top:0;background:#0f1117;border-bottom:1px solid #30363d;padding:12px 16px;z-index:10}
.back-btn{background:0;border:1px solid #30363d;color:#e1e4e8;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .15s}
.back-btn:hover{background:#1c2128}
.detail-body{max-width:900px;margin:0 auto;padding:24px 16px 60px}
.detail-title{font-size:20px;font-weight:600;color:#f0f6fc;margin-bottom:6px}
.detail-meta{color:#8b949e;font-size:13px;margin-bottom:8px}
.detail-meta span{margin-right:16px}
.detail-summary{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px 16px;margin:16px 0;color:#d2d8e0;font-size:13px;line-height:1.6}
.detail-summary strong{color:#f0f6fc}
.yt-link{display:inline-flex;align-items:center;gap:6px;background:#21262d;padding:6px 14px;border-radius:6px;font-size:13px;color:#58a6ff;margin:8px 0 16px;transition:background .15s}
.yt-link:hover{background:#30363d;text-decoration:none}
.chapter-list{display:flex;flex-direction:column;gap:6px}
.chapter-item{background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden}
.chapter-header{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background .15s;user-select:none}
.chapter-header:hover{background:#1c2128}
.chapter-ts{color:#58a6ff;font-family:monospace;font-size:12px;white-space:nowrap;cursor:pointer;padding:2px 6px;border-radius:4px;transition:background .15s}
.chapter-ts:hover{background:#30363d}
.chapter-title{flex:1;color:#d2d8e0;font-size:13px}
.chapter-arrow{color:#8b949e;font-size:11px;transition:transform .2s}
.chapter-body{display:none;padding:0 14px 12px 14px;background:#0d1117;border-top:1px solid #21262d}
.chapter-body.open{display:block}
.chapter-text{color:#8b949e;font-size:12px;line-height:1.7;padding:10px 0;font-family:monospace;white-space:pre-wrap;word-break:break-word}
.no-ts-msg{color:#8b949e;font-size:13px;padding:12px;background:#161b22;border-radius:8px;margin:16px 0}
.loading{text-align:center;padding:60px 0;color:#8b949e;font-size:15px}
.loading .spinner{display:inline-block;width:24px;height:24px;border:3px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:640px){
.video-row{grid-template-columns:28px 1fr 60px;padding:8px 12px 8px 38px}
.detail-body{padding:16px 12px 40px}
}
/* Markdown summary section */
.detail-md-section{margin-top:8px}
.markdown-body{padding:12px 16px;background:#161b22;border:1px solid #30363d;border-radius:8px;font-size:14px;line-height:1.7;overflow-x:auto}
.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4{margin:16px 0 8px;border-bottom:none}
.markdown-body h1{font-size:20px}
.markdown-body h2{font-size:17px}
.markdown-body h3{font-size:15px}
.markdown-body p{margin:6px 0}
.markdown-body ul,.markdown-body ol{padding-left:20px}
.markdown-body li{margin:3px 0}
.markdown-body code{background:#21262d;padding:2px 6px;border-radius:4px;font-size:13px}
.markdown-body pre{background:#0d1117;padding:12px;border-radius:6px;overflow-x:auto;border:1px solid #30363d}
.markdown-body pre code{background:none;padding:0}
.markdown-body strong{color:#f0f6fc}
.markdown-body a{color:#58a6ff}
.markdown-body hr{margin:16px 0;border-color:#30363d}
.markdown-body blockquote{border-left:3px solid #30363d;padding-left:12px;color:#8b949e;margin:8px 0}
</style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css">
</head>
<body>

<div class="container" id="main">
<h1>🧬 SPARK 自闭症研究网络研讨会</h1>
<div class="subtitle">按主题分类 • 点击视频标题查看详情和时间轴</div>
<div class="stats" id="stats"></div>
<input class="search-box" id="search" placeholder="搜索视频标题..." oninput="render()">
<div id="topic-list">
  <div class="loading"><div class="spinner"></div><br>加载数据中...</div>
</div>
</div>

<div class="detail-overlay" id="detail">
<div class="detail-header">
<button class="back-btn" onclick="closeDetail()">← 返回列表</button>
<button class="back-btn" style="margin-left:8px" onclick="copyLink()" id="copy-btn">🔗 复制链接</button>
</div>
<div class="detail-body" id="detail-body"></div>
</div>

<script>
var VIDEOS = [], CHAPTERS = {}, TOPIC_ORDER = [];

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;');
}

function render(){
  var q = document.getElementById('search').value.toLowerCase().trim();
  var el = document.getElementById('topic-list');
  var html = '';

  TOPIC_ORDER.forEach(function(topic){
    var videos = VIDEOS.filter(function(v){ return v.g === topic; });
    if(videos.length===0) return;
    if(q){
      videos = videos.filter(function(v){ return v.t.toLowerCase().includes(q); });
      if(videos.length===0) return;
    }
    var open = q ? 'open' : ((videos.length<=8||q) ? 'open' : '');
    html += '<div class="topic-section">'+
      '<div class="topic-header '+open+'" onclick="toggleTopic(this)">'+
        '<span class="arrow">▶</span>'+
        '<span class="topic-name">'+topic+'</span>'+
        '<span class="topic-count">'+videos.length+' 个视频</span>'+
      '</div>'+
      '<div class="video-list '+open+'">';
    videos.forEach(function(v){
      html += '<div class="video-row" onclick="openDetail('+v.i+')">'+
        '<span class="idx">#'+v.i+'</span>'+
        '<span class="title">'+
          (v.h ? '<span class="has-ts"></span>' : '<span class="no-ts"></span>')+
          v.t+
          (v.m ? '<span class="has-md">📝</span>' : '')+
        '</span>'+
        '<span class="dur">'+v.d+'</span>'+
      '</div>';
    });
    html += '</div></div>';
  });
  el.innerHTML = html;
}

function toggleTopic(el){
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}

function closeDetail(){
  document.getElementById('detail').classList.remove('open');
  document.body.style.overflow = '';
  history.replaceState(null, '', location.pathname);
}

// Browser back/forward button support
window.addEventListener('hashchange', function(){
  var hash = location.hash;
  if(hash && hash.indexOf('#video-') === 0){
    var idx = parseInt(hash.replace('#video-', ''), 10);
    if(!isNaN(idx)) openDetail(idx);
  } else {
    closeDetail();
  }
});

function copyLink(){
  var url = location.href.split('#')[0] + location.hash;
  navigator.clipboard.writeText(url).then(function(){
    var btn = document.getElementById('copy-btn');
    btn.textContent = '✅ 已复制';
    setTimeout(function(){ btn.textContent = '🔗 复制链接'; }, 2000);
  });
}

function openDetail(idx){
  var v = VIDEOS[idx-1];
  if(!v) return;
  document.body.style.overflow = 'hidden';
  document.getElementById('detail').classList.add('open');
  location.hash = '#video-'+idx;

  var chs = CHAPTERS[v.id] || [];
  var html = '';

  html += '<div class="detail-title">#'+v.i+' '+v.t+'</div>';
  html += '<div class="detail-meta">';
  if(v.d) html += '<span>⏱ '+v.d+'</span>';
  if(v.g) html += '<span>📂 '+v.g+'</span>';
  html += '</div>';
  if(v.p) html += '<div class="detail-meta">👤 '+v.p+'</div>';

  html += '<a class="yt-link" href="https://www.youtube.com/watch?v='+v.id+'" target="_blank">▶ 在 YouTube 上观看</a>';

  html += '<div class="detail-summary"><strong>📝 摘要</strong><br>'+v.s+'</div>';

  if(chs.length > 0){
    html += '<div class="detail-meta" style="margin-top:20px;font-weight:600;color:#f0f6fc">📋 内容时间轴 ('+chs.length+' 章节)</div>';
    html += '<div class="chapter-list">';
    chs.forEach(function(ch, ci){
      var tsLink = 'https://www.youtube.com/watch?v='+v.id+'&t='+ch.ts;
      var linesHtml = ch.preview.replace(/\\n/g, '\n');
      html += '<div class="chapter-item">'+
        '<div class="chapter-header" onclick="toggleChapter(this)">'+
          '<a class="chapter-ts" href="'+tsLink+'" target="_blank" onclick="event.stopPropagation()">'+ch.ts_str+' – '+ch.end_ts_str+'</a>'+
          '<span class="chapter-title">'+esc(ch.title)+'</span>'+
          '<span class="chapter-arrow">▼</span>'+
        '</div>'+
        '<div class="chapter-body">'+
          '<div class="chapter-text">'+linesHtml+'</div>'+
          '<div style="margin-top:8px"><a class="yt-link" href="'+tsLink+'" target="_blank" style="display:inline-flex;padding:4px 12px;font-size:12px">▶ YouTube 观看此段</a></div>'+
        '</div>'+
      '</div>';
    });
    html += '</div>';
  } else if (v.h) {
    html += '<div class="no-ts-msg">字幕已获取，但未能分段（内容可能较短）</div>';
  } else {
    html += '<div class="no-ts-msg">⚠ 此视频暂无可用字幕，摘要是根据标题和项目背景生成</div>';
  }

  // Render associated markdown summary if available
  if(v.m){
    html += '<div class="detail-md-section">' +
      '<div class="detail-meta" style="margin-top:20px;font-weight:600;color:#f0f6fc">📄 中文解读</div>' +
      '<div class="markdown-body" id="md-content-'+v.i+'"><em>加载中...</em></div></div>';

    // Fetch and render via fetch in a separate pass
    setTimeout(function(id, url){
      fetch(url).then(function(r){
        if(!r.ok) throw new Error('Not found');
        return r.text();
      }).then(function(md){
        var el = document.getElementById('md-content-'+id);
        if(el && typeof marked !== 'undefined'){
          el.innerHTML = marked.parse(md);
        } else if(el) {
          el.innerHTML = '<pre style="background:#0d1117;padding:12px;border-radius:6px">'+esc(md)+'</pre>';
        }
      }).catch(function(e){
        var el = document.getElementById('md-content-'+id);
        if(el) el.innerHTML = '<span style="color:#f85149">⚠ 解读文件暂不可用</span>';
      });
    }, 100, v.i, v.m);
  }

  document.getElementById('detail-body').innerHTML = html;
}

function toggleChapter(el){
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
  var arrow = el.querySelector('.chapter-arrow');
  if(arrow) arrow.textContent = el.classList.contains('open') ? '▲' : '▼';
}

fetch('spark_webinars_data.json').then(function(r){ return r.json(); }).then(function(data){
  VIDEOS = data.videos;
  CHAPTERS = data.chapters;
  TOPIC_ORDER = data.topic_order;

  var totalTranscripts = VIDEOS.filter(function(v){ return v.h; }).length;
  document.getElementById('stats').innerHTML =
    '<div class="stat-card"><div class="num">'+VIDEOS.length+'</div><div class="label">总视频</div></div>'+
    '<div class="stat-card"><div class="num">'+totalTranscripts+'</div><div class="label">有字幕</div></div>'+
    '<div class="stat-card"><div class="num">'+TOPIC_ORDER.length+'</div><div class="label">主题分类</div></div>';

  render();

  if(location.hash.startsWith('#video-')){
    var idx = parseInt(location.hash.slice(7));
    if(idx > 0) setTimeout(function(){ openDetail(idx); }, 100);
  }
}).catch(function(err){
  document.getElementById('topic-list').innerHTML =
    '<div style="text-align:center;padding:40px;color:#f85149;">⚠ 数据加载失败：'+err.message+'</div>';
});
</script>
</body>
</html>
